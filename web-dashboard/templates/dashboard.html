<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 Security Operations Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(78, 205, 196, 0.3);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .stat-number {
            font-size: 2.5em;
            font-weight: bold;
            margin: 10px 0;
        }
        
        .critical { color: #ff6b6b; }
        .high { color: #ffa726; }
        .medium { color: #42a5f5; }
        .low { color: #66bb6a; }
        
        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .alerts-container {
            background: rgba(255, 255, 255, 0.08);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .alert-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #ff6b6b;
        }
        
        .alert-critical { border-left-color: #ff6b6b; }
        .alert-high { border-left-color: #ffa726; }
        .alert-medium { border-left-color: #42a5f5; }
        
        .alert-header {
            display: flex;
            justify-content: between;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .alert-type {
            font-weight: bold;
            font-size: 1.1em;
        }
        
        .alert-severity {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .severity-critical { background: #ff6b6b; color: white; }
        .severity-high { background: #ffa726; color: white; }
        .severity-medium { background: #42a5f5; color: white; }
        
        .alert-details {
            color: #cccccc;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .last-updated {
            text-align: center;
            color: #888;
            margin-top: 20px;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 SECURITY OPERATIONS CENTER</h1>
            <p>Real-time Threat Monitoring & Analysis Dashboard</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <!-- Stats will be populated by JavaScript -->
        </div>
        
        <div class="charts-container">
            <div class="chart-card">
                <h3>📊 Threats by Severity</h3>
                <canvas id="severityChart"></canvas>
            </div>
            <div class="chart-card">
                <h3>🌍 Attacks by Country</h3>
                <canvas id="countryChart"></canvas>
            </div>
        </div>
        
        <div class="alerts-container">
            <h3>🚨 Recent Security Alerts</h3>
            <div id="alertsList">
                <!-- Alerts will be populated by JavaScript -->
            </div>
        </div>
        
        <div class="last-updated" id="lastUpdated">
            Last updated: <span id="updateTime">Never</span>
        </div>
    </div>

    <script>
        let severityChart, countryChart;
        
        // Update dashboard data
        async function updateDashboard() {
            try {
                // Update stats
                const statsResponse = await fetch('/api/stats');
                const stats = await statsResponse.json();
                
                updateStats(stats);
                
                // Update charts
                updateCharts(stats);
                
                // Update recent alerts
                const alertsResponse = await fetch('/api/alerts');
                const alerts = await alertsResponse.json();
                
                updateAlerts(alerts);
                
                // Update timestamp
                document.getElementById('updateTime').textContent = new Date().toLocaleString();
                
            } catch (error) {
                console.error('Error updating dashboard:', error);
            }
        }
        
        function updateStats(stats) {
            const statsGrid = document.getElementById('statsGrid');
            
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div>🚨 Total Alerts</div>
                    <div class="stat-number critical">${stats.total_alerts || 0}</div>
                    <div>Security Events Detected</div>
                </div>
                <div class="stat-card">
                    <div>🔴 Critical</div>
                    <div class="stat-number critical">${stats.by_severity?.CRITICAL || 0}</div>
                    <div>Immediate Action Required</div>
                </div>
                <div class="stat-card">
                    <div>🟡 High Risk</div>
                    <div class="stat-number high">${stats.by_severity?.HIGH || 0}</div>
                    <div>Priority Investigation</div>
                </div>
                <div class="stat-card">
                    <div>🔵 Medium Risk</div>
                    <div class="stat-number medium">${stats.by_severity?.MEDIUM || 0}</div>
                    <div>Monitor Closely</div>
                </div>
            `;
        }
        
        function updateCharts(stats) {
            // Severity Chart
            const severityCtx = document.getElementById('severityChart').getContext('2d');
            
            if (severityChart) {
                severityChart.destroy();
            }
            
            severityChart = new Chart(severityCtx, {
                type: 'doughnut',
                data: {
                    labels: ['Critical', 'High', 'Medium'],
                    datasets: [{
                        data: [
                            stats.by_severity?.CRITICAL || 0,
                            stats.by_severity?.HIGH || 0,
                            stats.by_severity?.MEDIUM || 0
                        ],
                        backgroundColor: ['#ff6b6b', '#ffa726', '#42a5f5'],
                        borderWidth: 2,
                        borderColor: '#1a1a2e'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                color: '#ffffff',
                                font: {
                                    size: 12
                                }
                            }
                        }
                    }
                }
            });
            
            // Country Chart
            const countryCtx = document.getElementById('countryChart').getContext('2d');
            
            if (countryChart) {
                countryChart.destroy();
            }
            
            const countries = Object.keys(stats.by_country || {}).slice(0, 8);
            const countryData = countries.map(country => stats.by_country[country]);
            
            countryChart = new Chart(countryCtx, {
                type: 'bar',
                data: {
                    labels: countries,
                    datasets: [{
                        label: 'Attack Count',
                        data: countryData,
                        backgroundColor: '#4ecdc4',
                        borderColor: '#45b7d1',
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: {
                            labels: {
                                color: '#ffffff'
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                color: '#ffffff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        },
                        x: {
                            ticks: {
                                color: '#ffffff'
                            },
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            }
                        }
                    }
                }
            });
        }
        
        function updateAlerts(alerts) {
            const alertsList = document.getElementById('alertsList');
            
            if (!alerts.length || (alerts.error)) {
                alertsList.innerHTML = '<div class="alert-item">No security alerts found. System is secure.</div>';
                return;
            }
            
            alertsList.innerHTML = alerts.slice(0, 10).map(alert => `
                <div class="alert-item alert-${alert.severity?.toLowerCase() || 'medium'}">
                    <div class="alert-header">
                        <div class="alert-type">${alert.alert_type || 'SECURITY_ALERT'}</div>
                        <div class="alert-severity severity-${alert.severity?.toLowerCase() || 'medium'}">
                            ${alert.severity || 'MEDIUM'}
                        </div>
                    </div>
                    <div class="alert-message">${alert.message || 'Security event detected'}</div>
                    <div class="alert-details">
                        🌍 ${alert.country || 'Unknown'} | 
                        📍 ${alert.source_ip || 'Unknown IP'} | 
                        🕒 ${alert.timestamp || 'Unknown time'}
                    </div>
                    ${alert.details ? `<div class="alert-details">📋 ${alert.details}</div>` : ''}
                </div>
            `).join('');
        }
        
        // Initial load
        updateDashboard();
        
        // Update every 5 seconds
        setInterval(updateDashboard, 5000);
    </script>
</body>
</html>
